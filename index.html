<!DOCTYPE html>

  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #060709;
      color: #ffffff;
      overflow-x: hidden;
    }

    .glass-panel {
      background: rgba(18, 20, 26, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .glass-card:hover {
      border-color: rgba(229, 29, 45, 0.4);
      box-shadow: 0 10px 30px -10px rgba(229, 29, 45, 0.15);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #060709; }
    ::-webkit-scrollbar-thumb { background: #1a1c23; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #E51D2D; }
  </style>
</head>
<body class="antialiased selection:bg-[#E51D2D]/30 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SUPABASE BACKEND CONFIGURATION ---
    const SUPABASE_URL = "https://bgijbonquvlfhcqxgyez.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnaWpib25xdXZsZmhjcXhneWV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MTI4MTIsImV4cCI6MjEwMDQ4ODgxMn0.nN7Ty0wV2712JZTdiQ663DGSS8BZj-fopY7s9_SHAys"; 

    // Create Supabase Client Connection
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Direct GitHub Raw image URL for your uploaded logo
    const LOGO_URL = "https://raw.githubusercontent.com/YourUsername/YourRepo/main/monetox.png";

    // Lucide Icon Wrapper Component
    function Icon({ name, size = 18, color, className = "", strokeWidth = 2 }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          if (window.lucide && window.lucide.icons[name]) {
            lucide.createIcons({
              icons: { [name]: lucide.icons[name] },
              nameAttr: 'data-lucide'
            });
          }
        }
      }, [name]);

      return (
        <i 
          ref={ref} 
          data-lucide={name} 
          style={{ width: size, height: size, color: color, strokeWidth: strokeWidth, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
          className={className}
        />
      );
    }

    // Reveal Animation
    function Reveal({ children, delay = 0, className = "" }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              io.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);

      return (
        <div
          ref={ref}
          className={className}
          style={{
            opacity: visible ? 1 : 0,
            transform: visible ? "translateY(0px)" : "translateY(24px)",
            transition: `opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) ${delay}ms, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) ${delay}ms`,
          }}
        >
          {children}
        </div>
      );
    }

    // Logo Component
    function Logo({ size = 32, showText = true }) {
      return (
        <div className="relative flex items-center gap-2.5 shrink-0 group cursor-pointer">
          <img 
            src={LOGO_URL} 
            alt="Monetox Logo" 
            style={{ height: size, width: 'auto' }}
            className="object-contain transition-transform duration-300 group-hover:scale-105"
            onError={(e) => {
              e.target.style.display = 'none';
              if(e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
            }}
          />
          <div 
            className="hidden items-center justify-center rounded-xl bg-gradient-to-br from-[#E51D2D] to-[#2B2A96] p-0.5"
            style={{ width: size, height: size }}
          >
            <div className="w-full h-full bg-[#08090a] rounded-[10px] flex items-center justify-center">
              <span className="font-extrabold text-white text-xs">MX</span>
            </div>
          </div>
          {showText && (
            <span className="text-[17px] font-bold tracking-tight text-white">Monetox</span>
          )}
        </div>
      );
    }

    function Pill({ children, className = "" }) {
      return (
        <span
          className={"inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-[12px] font-semibold tracking-wide uppercase text-white/80 " + className}
          style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.09)", backdropFilter: "blur(12px)" }}
        >
          {children}
        </span>
      );
    }

    // Header
    function Header() {
      const [open, setOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener("scroll", onScroll);
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const links = [
        { label: "Services", href: "#services" },
        { label: "Mentorship", href: "#mentorship" },
        { label: "Work", href: "#work" },
        { label: "Process", href: "#process" },
        { label: "Pricing", href: "#pricing" },
      ];

      return (
        <header className="fixed top-0 inset-x-0 z-50 px-4 sm:px-8 pt-4">
          <div className={`mx-auto max-w-7xl rounded-2xl transition-all duration-300 ${scrolled ? "glass-panel py-3 px-5 shadow-2xl" : "bg-transparent py-4 px-2"}`}>
            <div className="flex items-center justify-between">
              <a href="#top"><Logo size={36} /></a>
              <nav className="hidden md:flex items-center gap-1 glass-panel px-4 py-1.5 rounded-full border border-white/10">
                {links.map((l) => (
                  <a key={l.label} href={l.href} className="rounded-full px-4 py-1.5 text-[13.5px] font-medium text-white/70 transition-all duration-200 hover:text-white hover:bg-white/10">
                    {l.label}
                  </a>
                ))}
              </nav>
              <div className="hidden md:flex items-center gap-3">
                <a href="#pricing" className="text-[13.5px] font-medium text-white/70 hover:text-white px-3 py-1.5 transition-colors">
                  Calculator
                </a>
                <a href="#pricing" className="group relative inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-[13.5px] font-semibold text-white bg-gradient-to-r from-[#E51D2D] to-[#2B2A96] hover:opacity-95 transition-all duration-200 hover:scale-[1.02] shadow-lg shadow-[#E51D2D]/25">
                  Book Strategy Call
                  <Icon name="arrow-right" size={15} />
                </a>
              </div>
              <button className="md:hidden text-white/80 p-2" onClick={() => setOpen((v) => !v)} aria-label="Toggle menu">
                <Icon name={open ? "x" : "menu"} size={22} />
              </button>
            </div>
          </div>
          {open && (
            <div className="md:hidden mt-2 rounded-2xl p-5 glass-panel border border-white/10 flex flex-col gap-3">
              {links.map((l) => (
                <a key={l.label} href={l.href} onClick={() => setOpen(false)} className="rounded-lg px-3 py-2 text-[15px] font-medium text-white/80 hover:bg-white/5">
                  {l.label}
                </a>
              ))}
              <a href="#pricing" onClick={() => setOpen(false)} className="mt-2 text-center rounded-xl py-3 text-[14px] font-semibold text-white bg-gradient-to-r from-[#E51D2D] to-[#2B2A96]">
                Book Strategy Call
              </a>
            </div>
          )}
        </header>
      );
    }

    // Hero Section
    function Hero() {
      return (
        <section id="top" className="relative min-h-screen flex items-center justify-center pt-32 pb-20 px-5 sm:px-8 overflow-hidden">
          <div className="pointer-events-none absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 h-[500px] w-[800px] rounded-full opacity-30 bg-gradient-to-tr from-[#2B2A96] to-[#E51D2D] blur-[120px]" />
          <div className="relative mx-auto max-w-5xl text-center">
            <Reveal>
              <Pill className="mx-auto mb-6">
                <Icon name="sparkles" size={14} className="text-[#E51D2D]" />
                Full-Stack Digital Agency & Mentorship
              </Pill>
            </Reveal>
            <Reveal delay={100}>
              <h1 className="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-white leading-[1.08]">
                Digital Creation at <br />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#E51D2D] via-purple-400 to-[#6366f1]">
                  Light Speed.
                </span>
              </h1>
            </Reveal>
            <Reveal delay={200}>
              <p className="mx-auto mt-6 max-w-2xl text-base sm:text-lg leading-relaxed text-white/60">
                We engineer high-converting websites, craft viral video edits, write vibe code apps, and coach freelancers to $10k+/mo on Upwork.
              </p>
            </Reveal>
            <Reveal delay={300}>
              <div className="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="#pricing" className="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-full bg-white px-8 py-3.5 text-sm font-bold text-black transition-all hover:bg-white/90 hover:scale-105 shadow-xl">
                  Scale Your Brand
                  <Icon name="arrow-right" size={16} />
                </a>
                <a href="#mentorship" className="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-full glass-panel px-8 py-3.5 text-sm font-semibold text-white transition-all hover:bg-white/10">
                  <Icon name="graduation-cap" size={16} className="text-[#E51D2D]" />
                  Upwork Mentorship
                </a>
              </div>
            </Reveal>
          </div>
        </section>
      );
    }

    // Services Section
    function Services() {
      const services = [
        { id: "video", title: "Cinematic Video Editing", icon: "clapperboard", image: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=800&q=80", desc: "Retain viewer attention with custom color grading, sound design, and viral retention editing.", tags: ["Retention", "Sound FX", "Shorts"] },
        { id: "coding", title: "Vibe Coding & App Development", icon: "code", image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80", desc: "Rapid prototyping and full-stack web applications built at light speed using modern frameworks.", tags: ["AI-Assisted", "MVPs", "React"] },
        { id: "web", title: "Web Design & Development", icon: "layout", image: "https://images.unsplash.com/photo-1581291518633-83b4ebd1d83e?auto=format&fit=crop&w=800&q=80", desc: "Pixel-perfect, ultra-fast websites engineered to build brand authority and convert visitors.", tags: ["UI/UX", "Tailwind CSS", "Figma"] }
      ];

      return (
        <section id="services" className="relative py-20 px-5 sm:px-8 max-w-7xl mx-auto">
          <Reveal>
            <div className="text-center max-w-2xl mx-auto">
              <Pill><Icon name="layers" size={13} className="text-[#E51D2D]" /> Our Capabilities</Pill>
              <h2 className="mt-4 text-3xl sm:text-5xl font-extrabold text-white">Everything your brand demands.</h2>
            </div>
          </Reveal>
          <div className="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6">
            {services.map((s, idx) => (
              <Reveal key={s.id} delay={idx * 80}>
                <div className="glass-card rounded-2xl overflow-hidden h-full flex flex-col p-6">
                  <h3 className="text-xl font-bold text-white">{s.title}</h3>
                  <p className="mt-2 text-sm text-white/50">{s.desc}</p>
                </div>
              </Reveal>
            ))}
          </div>
        </section>
      );
    }

    // Dynamic Portfolio Section (Connects to Supabase Database)
    function Portfolio() {
      const [filter, setFilter] = useState("all");
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);

      const fallbackProjects = [
        { title: "SaaS Vibe Code MVP", category: "coding", image_url: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800&q=80", tag: "Vibe Coding" },
        { title: "Gaming Channel Rebrand", category: "video", image_url: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=800&q=80", tag: "Video Edit" },
        { title: "FinTech Platform Design", category: "web", image_url: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80", tag: "Web Design" }
      ];

      useEffect(() => {
        async function fetchPortfolio() {
          if (!supabaseClient) {
            setProjects(fallbackProjects);
            setLoading(false);
            return;
          }

          try {
            const { data, error } = await supabaseClient.from('portfolio').select('*');
            if (error || !data || data.length === 0) {
              setProjects(fallbackProjects);
            } else {
              setProjects(data);
            }
          } catch (err) {
            setProjects(fallbackProjects);
          } finally {
            setLoading(false);
          }
        }
        fetchPortfolio();
      }, []);

      const filtered = filter === "all" ? projects : projects.filter(p => p.category === filter);

      return (
        <section id="work" className="py-24 px-5 sm:px-8 max-w-7xl mx-auto">
          <Reveal>
            <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
              <div>
                <Pill><Icon name="briefcase" size={13} className="text-[#E51D2D]" /> Portfolio</Pill>
                <h2 className="mt-4 text-3xl sm:text-5xl font-extrabold text-white">Crafted for high impact.</h2>
              </div>
              <div className="flex flex-wrap gap-2 glass-panel p-1.5 rounded-xl">
                {["all", "video", "coding", "web"].map((cat) => (
                  <button
                    key={cat}
                    onClick={() => setFilter(cat)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold uppercase ${filter === cat ? "bg-[#E51D2D] text-white" : "text-white/60"}`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>
          </Reveal>

          <div className="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6">
            {filtered.map((item, idx) => (
              <Reveal key={idx} delay={idx * 60}>
                <div className="glass-card rounded-2xl overflow-hidden group relative">
                  <div className="h-64 overflow-hidden relative">
                    <img src={item.image_url} alt={item.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                  </div>
                  <div className="p-5">
                    <span className="text-[10px] font-bold uppercase px-2 py-1 rounded bg-[#E51D2D] text-white">{item.tag || item.category}</span>
                    <h3 className="mt-2 text-lg font-bold text-white">{item.title}</h3>
                  </div>
                </div>
              </Reveal>
            ))}
          </div>
        </section>
      );
    }

    // Dynamic Pricing & Backend Lead Submission Component
    function DynamicPricing() {
      const [selectedServices, setSelectedServices] = useState(["video"]);
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [submitting, setSubmitting] = useState(false);
      const [message, setMessage] = useState(null);

      const pricingOptions = [
        { id: "video", label: "Video Editing Package", price: 1200 },
        { id: "coding", label: "Vibe Code / MVP App", price: 2500 },
        { id: "web", label: "Custom Agency Web Design", price: 1800 },
        { id: "mentorship", label: "1-on-1 Upwork Coaching", price: 950 }
      ];

      const toggleService = (id) => {
        if (selectedServices.includes(id)) {
          if (selectedServices.length > 1) setSelectedServices(selectedServices.filter(s => s !== id));
        } else {
          setSelectedServices([...selectedServices, id]);
        }
      };

      const totalPrice = selectedServices.reduce((acc, currId) => {
        const item = pricingOptions.find(o => o.id === currId);
        return acc + (item ? item.price : 0);
      }, 0);

      // --- SUBMIT LEAD TO SUPABASE BACKEND ---
      const handleLeadSubmit = async (e) => {
        e.preventDefault();
        if (!email || !name) {
          setMessage({ type: "error", text: "Please fill out both your name and email." });
          return;
        }

        setSubmitting(true);
        setMessage(null);

        try {
          const { data, error } = await supabaseClient
            .from('leads')
            .insert([
              { 
                name: name, 
                email: email, 
                selected_services: selectedServices.join(", "), 
                estimated_budget: totalPrice 
              }
            ]);

          if (error) {
            setMessage({ type: "error", text: "Database Error: " + error.message });
          } else {
            setMessage({ type: "success", text: "Request Received! We'll contact you shortly." });
            setName("");
            setEmail("");
          }
        } catch (err) {
          setMessage({ type: "error", text: "Failed to connect to backend server." });
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <section id="pricing" className="py-24 px-5 sm:px-8 max-w-7xl mx-auto">
          <Reveal>
            <div className="text-center max-w-2xl mx-auto">
              <Pill><Icon name="calculator" size={13} className="text-[#E51D2D]" /> Interactive Pricing</Pill>
              <h2 className="mt-4 text-3xl sm:text-5xl font-extrabold text-white">Customize Your Investment.</h2>
            </div>
          </Reveal>

          <div className="mt-12 glass-panel p-6 sm:p-10 rounded-3xl grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-7 space-y-3">
              <h3 className="text-lg font-bold text-white mb-4">Select Required Services:</h3>
              {pricingOptions.map((opt) => {
                const isChecked = selectedServices.includes(opt.id);
                return (
                  <div
                    key={opt.id}
                    onClick={() => toggleService(opt.id)}
                    className={`p-4 rounded-xl cursor-pointer transition-all flex items-center justify-between border ${isChecked ? "bg-[#E51D2D]/15 border-[#E51D2D] text-white" : "glass-card border-white/5 text-white/60"}`}
                  >
                    <span className="font-semibold text-sm">{opt.label}</span>
                    <span className="font-bold text-sm text-white">${opt.price}</span>
                  </div>
                );
              })}
            </div>

            {/* Lead Form */}
            <div className="lg:col-span-5 glass-card p-6 rounded-2xl flex flex-col justify-center">
              <span className="text-xs uppercase font-bold text-white/40 text-center">Total Estimated Investment</span>
              <div className="mt-2 text-4xl font-extrabold text-center text-white">${totalPrice.toLocaleString()}</div>
              
              <form onSubmit={handleLeadSubmit} className="mt-6 space-y-3">
                <input 
                  type="text" 
                  placeholder="Your Full Name" 
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-[#E51D2D]"
                />
                <input 
                  type="email" 
                  placeholder="Your Email Address" 
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-[#E51D2D]"
                />

                <button 
                  type="submit" 
                  disabled={submitting}
                  className="w-full py-3 rounded-full bg-gradient-to-r from-[#E51D2D] to-[#2B2A96] text-white font-bold text-sm hover:opacity-90 disabled:opacity-50"
                >
                  {submitting ? "Sending Request..." : "Lock In Estimate"}
                </button>

                {message && (
                  <div className={`text-xs text-center p-2 rounded-lg ${message.type === 'error' ? 'bg-red-500/20 text-red-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                    {message.text}
                  </div>
                )}
              </form>
            </div>
          </div>
        </section>
      );
    }

    // Footer
    function Footer() {
      return (
        <footer className="border-t border-white/10 py-12 px-5 sm:px-8 max-w-7xl mx-auto text-xs text-white/40 flex flex-col sm:flex-row items-center justify-between gap-6">
          <Logo size={28} />
          <div>© {new Date().getFullYear()} Monetox Agency. All rights reserved.</div>
        </footer>
      );
    }

    // App Component
    function App() {
      return (
        <div className="min-h-screen bg-[#060709] text-white">
          <Header />
          <main>
            <Hero />
            <Services />
            <Portfolio />
            <DynamicPricing />
          </main>
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
