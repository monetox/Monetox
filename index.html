<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monetox — Digital Execution & Agency Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #060709;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Custom Glassmorphism */
    .glass-panel {
      background: rgba(18, 20, 26, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {

      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .glass-card:hover {
      border-color: rgba(229, 29, 45, 0.4);
      box-shadow: 0 10px 30px -10px rgba(229, 29, 45, 0.15);
    }

    /* Custom Scrollbar */

      width: 8px;
    }

    }
    ::-webkit-scrollbar-thumb {

</head>
<body class="antialiased selection:bg-[#E51D2D]/30 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // Create Modal Global Context for Interactive Buttons
    const ModalContext = createContext();

    // Lucide Icon Wrapper Component
    function Icon({ name, size = 18, color, className = "", strokeWidth = 2 }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          if (window.lucide && window.lucide.icons[name]) {
            lucide.createIcons({
              icons: { [name]: lucide.icons[name] },
              nameAttr: 'data-lucide'
            });
          }
        }
      }, [name]);

      return (
        <i 
          ref={ref} 
          data-lucide={name} 
          style={{ width: size, height: size, color: color, strokeWidth: strokeWidth, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
          className={className}
        />
      );
    }

    // Intersection Observer Reveal Component
    function Reveal({ children, delay = 0, className = "" }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              io.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);

      return (
        <div
          ref={ref}
          className={className}
          style={{
            opacity: visible ? 1 : 0,
            transform: visible ? "translateY(0px)" : "translateY(24px)",
            transition: `opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) ${delay}ms, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) ${delay}ms`,
          }}
        >
          {children}
        </div>
      );
    }

    // Logo Component
    function Logo({ size = 32 }) {
      return (
        <div className="relative flex items-center gap-2.5 shrink-0 group cursor-pointer">
          <img 
            src="https://raw.githubusercontent.com/Tototkitfo/Monetox/main/monetox.jpg" 
            alt="Monetox Logo" 
            style={{ width: size, height: size }}
            className="rounded-xl object-cover transition-transform duration-300 group-hover:scale-105 shrink-0"
          />
          <span className="text-[17px] font-bold tracking-tight text-white whitespace-nowrap leading-none select-none">
            Monetox
          </span>
        </div>
      );
    }

    function Pill({ children, className = "" }) {
      return (
        <span
          className={"inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-[12px] font-semibold tracking-wide uppercase text-white/80 " + className}
          style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.09)", backdropFilter: "blur(12px)" }}
        >
          {children}
        </span>
      );
    }

    // Interactive Modal Popup with Live Email Routing & Dismissable Tag
    function BookingModal() {
      const { isOpen, closeModal, initialService, initialBudget } = useContext(ModalContext);
      const [submitted, setSubmitted] = useState(false);
      const [loading, setLoading] = useState(false);
      const [activeTag, setActiveTag] = useState(null);
      const [formData, setFormData] = useState({ name: '', email: '', service: 'General Strategy', details: '' });

      useEffect(() => {
        if (initialService) {
          setFormData(prev => ({ ...prev, service: initialService }));
          setActiveTag(initialService);
        } else {
          setActiveTag(null);
        }
      }, [initialService, isOpen]);

      if (!isOpen) return null;

      const clearTag = () => {
        setActiveTag(null);
        setFormData(prev => ({ ...prev, service: 'General Strategy' }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);

        try {
          const response = await fetch("https://formspree.io/f/xvzevpbl", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              name: formData.name,
              email: formData.email,
              serviceRequested: formData.service,
              estimatedBudget: initialBudget ? `$${initialBudget}` : "Custom Quote",
              projectDetails: formData.details,
              notificationRecipient: "tonikrossgala@gmail.com"
            }),
          });

          if (response.ok) {
            setSubmitted(true);
            setTimeout(() => {
              setSubmitted(false);
              closeModal();
            }, 3000);
          } else {
            alert("Submission error. Please check details or email tonikrossgala@gmail.com directly.");
          }
        } catch (error) {
          console.error("Form error:", error);
          alert("Network error occurred. Please try again later.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
          <div className="glass-panel w-full max-w-lg rounded-3xl p-6 sm:p-8 border border-white/10 relative shadow-2xl">
            {/* Modal Close Button */}
            <button 
              onClick={closeModal} 
              className="absolute top-5 right-5 p-2 text-white/50 hover:text-white rounded-full bg-white/5 hover:bg-white/10 transition-colors cursor-pointer"
            >
              <Icon name="x" size={18} />
            </button>

            {submitted ? (
              <div className="text-center py-12 space-y-4">
                <div className="w-20 h-20 bg-[#E51D2D]/20 border-2 border-[#E51D2D] rounded-full flex items-center justify-center mx-auto text-[#E51D2D] shadow-lg shadow-[#E51D2D]/30 animate-bounce">
                  <svg className="w-10 h-10 stroke-[#E51D2D]" fill="none" viewBox="0 0 24 24" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <h3 className="text-2xl font-bold text-white">Strategy Request Sent!</h3>
                <p className="text-white/60 text-sm max-w-sm mx-auto">
                  Your request was logged successfully. We've sent a notification to <strong className="text-white">tonikrossgala@gmail.com</strong>.
                </p>
              </div>
            ) : (
              <>
                <div className="mb-6">
                  {activeTag ? (
                    <div className="inline-flex items-center gap-2 rounded-full px-3.5 py-1.5 text-xs font-semibold bg-[#E51D2D]/20 border border-[#E51D2D]/40 text-white mb-3">
                      <Icon name="sparkles" size={12} className="text-[#E51D2D]" />
                      <span>{activeTag}</span>
                      {initialBudget && <span className="opacity-70">(${initialBudget})</span>}
                      <button 
                        type="button" 
                        onClick={clearTag}
                        title="Dismiss Tag"
                        className="ml-1 p-0.5 hover:bg-white/20 rounded-full transition-colors cursor-pointer"
                      >
                        <Icon name="x" size={13} className="text-white/80" />
                      </button>
                    </div>
                  ) : (
                    <Pill className="mb-3 text-[#E51D2D] border-[#E51D2D]/30">
                      <Icon name="sparkles" size={12} />
                      Let's Connect
                    </Pill>
                  )}

                  <h3 className="text-2xl font-extrabold text-white">Book A Strategy Session</h3>
                  <p className="text-sm text-white/50 mt-1">
                    {initialBudget ? `Estimated Bundle Total: $${initialBudget}` : "Tell us about your brand goals and project requirements."}
                  </p>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-white/70 mb-1">Your Name</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="Alex Morgan" 
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-white/30 focus:outline-none focus:border-[#E51D2D] transition-colors"
                      value={formData.name}
                      onChange={(e) => setFormData({...formData, name: e.target.value})}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-white/70 mb-1">Email Address</label>
                    <input 
                      type="email" 
                      required 
                      placeholder="alex@company.com" 
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-white/30 focus:outline-none focus:border-[#E51D2D] transition-colors"
                      value={formData.email}
                      onChange={(e) => setFormData({...formData, email: e.target.value})}
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-white/70 mb-1">Service Interest</label>
                    <select 
                      className="w-full bg-[#12141a] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#E51D2D] transition-colors"
                      value={formData.service}
                      onChange={(e) => {
                        setFormData({...formData, service: e.target.value});
                        setActiveTag(e.target.value);
                      }}
                    >
                      <option value="General Strategy">General Strategy Call</option>
                      <option value="Upwork Mentorship">Upwork Mentorship Program</option>
                      <option value="Video Editing">Cinematic Video Editing</option>
                      <option value="Vibe Coding">Vibe Code & MVP Development</option>
                      <option value="Web Design">Web Design & Brand Scaling</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-white/70 mb-1">Project Details</label>
                    <textarea 
                      rows="3" 
                      placeholder="Share brief details about your timeline or current revenue goals..." 
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-white/30 focus:outline-none focus:border-[#E51D2D] transition-colors resize-none"
                      value={formData.details}
                      onChange={(e) => setFormData({...formData, details: e.target.value})}
                    ></textarea>
                  </div>

                  <button 
                    type="submit" 
                    disabled={loading}
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#E51D2D] to-[#2B2A96] text-white font-bold text-sm hover:opacity-90 transition-all shadow-lg shadow-[#E51D2D]/30 mt-2 disabled:opacity-50 cursor-pointer"
                  >
                    {loading ? "Transmitting..." : "Confirm Booking"}
                  </button>
                </form>
              </>
            )}
          </div>
        </div>
      );
    }

    // Navigation Header
    function Header() {
      const [open, setOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const { openModal } = useContext(ModalContext);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener("scroll", onScroll);
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const links = [
        { label: "Services", href: "#services" },
        { label: "Mentorship", href: "#mentorship" },
        { label: "Work", href: "#work" },
        { label: "Process", href: "#process" },
        { label: "Pricing", href: "#pricing" },
        { label: "Reviews", href: "#reviews" },
      ];

      return (
        <header className="fixed top-0 inset-x-0 z-40 px-4 sm:px-8 pt-4">
          <div
            className={`mx-auto max-w-7xl rounded-2xl transition-all duration-300 ${
              scrolled ? "glass-panel py-3 px-5 shadow-2xl" : "bg-transparent py-4 px-2"
            }`}
          >
            <div className="flex items-center justify-between">
              <a href="#top" className="shrink-0 flex items-center">
                <Logo size={34} />
              </a>

              <nav className="hidden md:flex items-center gap-1 glass-panel px-4 py-1.5 rounded-full border border-white/10">
                {links.map((l) => (
                  <a key={l.label} href={l.href} className="rounded-full px-4 py-1.5 text-[13.5px] font-medium text-white/70 transition-all duration-200 hover:text-white hover:bg-white/10">
                    {l.label}
                  </a>
                ))}
              </nav>

              <div className="hidden md:flex items-center gap-3">
                <a href="#pricing" className="text-[13.5px] font-medium text-white/70 hover:text-white px-3 py-1.5 transition-colors">
                  Calculator
                </a>
                <button 
                  onClick={() => openModal('General Strategy')} 
                  className="group relative inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-[13.5px] font-semibold text-white bg-gradient-to-r from-[#E51D2D] to-[#2B2A96] hover:opacity-95 transition-all duration-200 hover:scale-[1.02] shadow-lg shadow-[#E51D2D]/25 active:scale-95 cursor-pointer"
                >
                  Book A Strategy Call
                  <Icon name="arrow-right" size={15} />
                </button>
              </div>

              <button className="md:hidden text-white/80 p-2" onClick={() => setOpen((v) => !v)} aria-label="Toggle menu">
                <Icon name={open ? "x" : "menu"} size={22} />
              </button>
            </div>
          </div>

          {open && (
            <div className="md:hidden mt-2 rounded-2xl p-5 glass-panel border border-white/10 flex flex-col gap-3">
              {links.map((l) => (
                <a key={l.label} href={l.href} onClick={() => setOpen(false)} className="rounded-lg px-3 py-2 text-[15px] font-medium text-white/80 hover:bg-white/5">
                  {l.label}
                </a>
              ))}
              <button 
                onClick={() => { setOpen(false); openModal('General Strategy'); }} 
                className="mt-2 text-center rounded-xl py-3 text-[14px] font-semibold text-white bg-gradient-to-r from-[#E51D2D] to-[#2B2A96]"
              >
                Book Strategy Call
              </button>
            </div>
          )}
        </header>
      );
    }

    // Hero Section (FIXED MOBILE OVERLAP: Replaced strict min-h-screen with flexible responsive padding, adjusted mobile aspect ratio and grid overlay spacing)
    function Hero() {
      const { openModal } = useContext(ModalContext);

      return (
        <section id="top" className="relative py-28 sm:min-h-screen sm:flex sm:items-center sm:justify-center px-5 sm:px-8 overflow-hidden">

          <div className="pointer-events-none absolute bottom-10 right-10 h-[300px] w-[300px] rounded-full opacity-20 bg-[#E51D2D] blur-[100px]" />

          <div className="relative mx-auto max-w-5xl text-center">

              </Pill>
            </Reveal>

            <Reveal delay={100}>
              <h1 className="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-white leading-[1.08]">
                Digital Creation at <br />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#E51D2D] via-purple-400 to-[#6366f1]">

                </span>
              </h1>
            </Reveal>

            <Reveal delay={200}>
              <p className="mx-auto mt-6 max-w-2xl text-base sm:text-lg leading-relaxed text-white/60">
                We engineer high-converting websites, craft viral video edits, write vibe code apps, and coach freelancers to $10k+/mo on Upwork.
              </p>
            </Reveal>

            <Reveal delay={300}>
              <div className="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                <button 
                  onClick={() => openModal('Brand Scaling')} 
                  className="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-full bg-white px-8 py-3.5 text-sm font-bold text-black transition-all duration-200 hover:bg-white/90 hover:scale-105 active:scale-95 shadow-xl shadow-white/10 cursor-pointer"
                >
                  Scale Your Brand
                  <Icon name="arrow-right" size={16} />
                </button>
                <a href="#mentorship" className="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-full glass-panel px-8 py-3.5 text-sm font-semibold text-white transition-all duration-200 hover:bg-white/10 hover:border-white/20 active:scale-95">
                  <Icon name="graduation-cap" size={16} className="text-[#E51D2D]" />
                  Upwork Mentorship
                </a>
              </div>
            </Reveal>

            <Reveal delay={400} className="mt-12 sm:mt-16">
              <div className="relative mx-auto max-w-5xl rounded-2xl p-2 glass-panel border border-white/10 shadow-2xl">
                <div className="relative rounded-xl overflow-hidden aspect-[4/3] sm:aspect-video bg-[#0b0d12]">

                    alt="Monetox Team Collaborating" 
                    className="w-full h-full object-cover opacity-80"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#060709] via-black/40 to-transparent" />
                  
                  <div className="absolute bottom-3 left-3 right-3 sm:bottom-6 sm:left-6 sm:right-6 grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-4">
                    {[
                      { label: "Projects Completed", value: "140+" },
                      { label: "Upwork Earnings Generated", value: "$350k+" },
                      { label: "Avg Turnaround", value: "48 Hours" },
                      { label: "Client CSAT", value: "99.2%" }
                    ].map((s, i) => (

          </div>
        </section>
      );
    }

    // Services Section
    function Services() {
      const { openModal } = useContext(ModalContext);

      const services = [
        { id: "video", title: "Cinematic Video Editing", icon: "clapperboard", image: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=800&q=80", desc: "Retain viewer attention with high-pacing, custom color grading, sound design, and viral retention editing for YouTube, Reels, and Ads.", tags: ["Retention Editing", "Color Grading", "Sound FX", "Shorts & Reels"] },
        { id: "coding", title: "Vibe Coding & App Development", icon: "code", image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80", desc: "Rapid prototyping and full-stack web applications built at light speed using modern AI workflows, React, Next.js, and Supabase.", tags: ["AI-Assisted Dev", "Full-Stack MVPs", "React / Next.js", "API Integrations"] },

        { id: "upwork", title: "Upwork Mentorship Program", icon: "award", image: "https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=800&q=80", desc: "1-on-1 coaching that guides freelancers to Top Rated status, high-converting proposal templates, and $10k+/mo contracts.", tags: ["Profile Optimization", "Proposal Mastery", "Client Acquisition", "Pricing Strategy"] },

      ];

      return (
        <section id="services" className="relative py-28 px-5 sm:px-8 max-w-7xl mx-auto">
          <Reveal>
            <div className="text-center max-w-2xl mx-auto">
              <Pill>
                <Icon name="layers" size={13} className="text-[#E51D2D]" />
                Our Core Capabilities
              </Pill>
              <h2 className="mt-4 text-3xl sm:text-5xl font-extrabold tracking-tight text-white">
                Everything your digital presence demands.
              </h2>
            </div>
          </Reveal>

          <div className="mt-16 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {services.map((s, idx) => (
              <Reveal key={s.id} delay={idx * 80}>
                <div 
                  onClick={() => openModal(s.title)}
                  className="glass-card rounded-2xl overflow-hidden group hover:-translate-y-1.5 transition-all duration-300 h-full flex flex-col cursor-pointer"

                  <div className="relative h-48 overflow-hidden">
                    <img src={s.image} alt={s.title} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 opacity-80 group-hover:opacity-100" />

                    <div className="absolute top-3 right-3 glass-panel p-2 rounded-xl text-white group-hover:bg-[#E51D2D] transition-colors">
                      <Icon name={s.icon} size={18} className="text-[#E51D2D] group-hover:text-white" />

                  </div>

                  <div className="p-6 flex flex-col flex-1">

    // Dynamic Pricing Engine
    function DynamicPricing() {
      const [selectedServices, setSelectedServices] = useState(["video"]);
      const { openModal } = useContext(ModalContext);

      const pricingOptions = [
        { id: "video", label: "Video Editing Package", price: 1200 },
        { id: "coding", label: "Vibe Code / MVP App", price: 2500 },
        { id: "web", label: "Custom Agency Web Design", price: 1800 },
        { id: "thumbnails", label: "Monthly Thumbnail Pack (10x)", price: 600 },
        { id: "mentorship", label: "1-on-1 Upwork Coaching", price: 950 }
      ];

      const toggleService = (id) => {
        if (selectedServices.includes(id)) {
          if (selectedServices.length > 1) {
            setSelectedServices(selectedServices.filter(s => s !== id));
          }
        } else {
          setSelectedServices([...selectedServices, id]);
        }
      };

      const totalPrice = selectedServices.reduce((acc, currId) => {
        const item = pricingOptions.find(o => o.id === currId);
        return acc + (item ? item.price : 0);
      }, 0);

      return (
        <section id="pricing" className="py-24 px-5 sm:px-8 max-w-7xl mx-auto">
          <Reveal>
            <div className="text-center max-w-2xl mx-auto">

                <Icon name="calculator" size={13} className="text-[#E51D2D]" />
                Interactive Pricing Engine
              </Pill>
              <h2 className="mt-4 text-3xl sm:text-5xl font-extrabold text-white">Customize Your Investment.</h2>
            </div>
          </Reveal>

          <div className="mt-12 glass-panel p-6 sm:p-10 rounded-3xl border border-white/10 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            <div className="lg:col-span-7 space-y-3">
              <h3 className="text-lg font-bold text-white mb-4">Select Required Services:</h3>
              {pricingOptions.map((opt) => {
                const isChecked = selectedServices.includes(opt.id);
                return (
                  <div
                    key={opt.id}
                    onClick={() => toggleService(opt.id)}
                    className={`p-4 rounded-xl cursor-pointer transition-all flex items-center justify-between border ${
                      isChecked ? "bg-[#E51D2D]/15 border-[#E51D2D] text-white" : "glass-card border-white/5 text-white/60 hover:border-white/20"
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <div className={`w-5 h-5 rounded-md flex items-center justify-center border transition-colors ${
                        isChecked ? "bg-[#E51D2D] border-[#E51D2D]" : "border-white/30"

                        {isChecked && <Icon name="check" size={12} className="text-white" />}
                      </div>
                      <span className="font-semibold text-sm">{opt.label}</span>
                    </div>
                    <span className="font-bold text-sm text-white">${opt.price}</span>
                  </div>
                );
              })}

              <span className="text-xs uppercase font-bold tracking-widest text-white/40">Estimated Investment</span>
              <div className="mt-3 text-5xl font-extrabold text-white">${totalPrice.toLocaleString()}</div>
              
              <button 
                onClick={() => openModal('Custom Bundle Package', totalPrice)} 
                className="mt-8 w-full py-3.5 rounded-full bg-gradient-to-r from-[#E51D2D] to-[#2B2A96] text-white font-bold text-sm hover:opacity-90 active:scale-95 transition-all shadow-lg shadow-[#E51D2D]/20 cursor-pointer"
